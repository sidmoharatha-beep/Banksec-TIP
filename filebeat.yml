filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /logs/firewall_events.json
    json.keys_under_root: true
    json.add_error_key: true

output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  index: "firewall-events-%{+yyyy.MM.dd}"

setup.kibana:
  host: "kibana:5601"

setup.ilm.enabled: false

logging.level: info
