# filebeat.yml — BankSec-TIP ELK Stack branch
# FIX: corrected YAML indentation on 'paths' (was misaligned, causing Filebeat to ignore log files)
# FIX: path now matches the volume mount in docker-compose.yml (/logs/firewall_events.json)

filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /logs/firewall_events.json
    json.keys_under_root: true
    json.add_error_key: true

output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  index: "firewall-events-%{+yyyy.MM.dd}"

setup.template.name: "banksec-threats"
setup.template.pattern: "banksec-threats-*"

setup.kibana:
  host: "kibana:5601"

setup.ilm.enabled: false

logging.level: info
