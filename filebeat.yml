# Filebeat configuration for BankSec-TIP ELK ingestion pipeline
filebeat.inputs:
  - type: log
    enabled: true
    paths:
  - /logs/firewall.log
    json.keys_under_root: true
    json.add_error_key: true

output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  index: "firewall-events-%{+yyyy.MM.dd}"

setup.template.name: "banksec-threats"
setup.template.pattern: "banksec-threats-*"

setup.kibana:
  host: "kibana:5601"

setup.ilm.enabled: false

logging.level: info
